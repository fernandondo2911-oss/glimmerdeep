<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glimmerdeep — a lantern-lit dig to the Heart of the mountain</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0916; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    width: min(100vw, 177.78vh);
    aspect-ratio: 16 / 9;
    display: block;
    touch-action: none;
    cursor: pointer;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Glimmerdeep: dig through the mine with WASD or arrow keys, swing your pickaxe with Space, and reach the Heart Crystal 62 metres down"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
